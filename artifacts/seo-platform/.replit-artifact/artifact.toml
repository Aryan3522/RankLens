kind = "web"
previewPath = "/"
title = "SEO Intelligence Platform"
version = "1.0.0"
id = "artifacts/seo-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24238

[services.development]
run = "pnpm --filter @workspace/seo-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seo-platform", "run", "build" ]
publicDir = "artifacts/seo-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24238"
BASE_PATH = "/"
